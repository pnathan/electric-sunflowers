# GitHub Actions build and test, beside BuildBuddy Workflows (buildbuddy.yaml).
# GitHub's own checks (required status checks, branch protection) see only
# GitHub Actions runs. Mirrors self-employment/.github/workflows/bazel.yml.
name: bazel

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # alsa-sys (audio playback in the studio) finds ALSA through pkg-config
      # at build time; X11 and GL are loaded at run time, so no headers.
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libogg-dev pkg-config

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The API key never touches a file; it is a flag on this one command,
      # scoped to this step's environment. --config=buildbuddy (.bazelrc)
      # supplies the cache and BES endpoint; this supplies the credential.
      - name: bazel build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bazel build --config=buildbuddy \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //...

      - name: bazel test
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bazel test --config=buildbuddy \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --test_output=errors \
            //...
