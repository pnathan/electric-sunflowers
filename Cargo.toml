[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 2
